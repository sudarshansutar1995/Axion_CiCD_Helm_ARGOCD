pool: default

trigger:
  - none

parameters:

- name: containerRegistry
  displayName: Ingestion_Docker_Build&Push
  type: boolean
  default: false

- name: Kubernate_secrer
  displayName: Kubernate_secrer
  type: boolean
  default: false
 
- name: Namespace_Environment
  displayName: Namespace_Environment
  type: string
  default: dev
  values:
  - dev
  - prod


variables:
- group: Axion_Group_variable


stages:
  - stage: 
    displayName: Ingestion_Docker_Build&Push 
    condition: eq('${{ parameters.containerRegistry }}', 'true')
    jobs:
      - job: 
        displayName: Ingestion_Docker_Build&Push 
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-acr-svc-connection'
            repository: 'axion-ingestion'
            command: 'buildAndPush'
            Dockerfile: '**/axion-ingestion-service/Dockerfile'
            tags: '$(Build.BuildId)-BuildId'
        
  - stage:
    displayName: Update Tags in github-> value-dev.yaml and value-pod.yaml
    jobs:
      - job:
        displayName: Update git file
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              $ErrorActionPreference = "Stop"
              
              $tag = "$(Build.BuildId)-BuildId"
              
              $files = @(
                  "axion-ingestion-service/helm/values-dev.yaml",
                  "axion-ingestion-service/helm/values-prod.yaml"
              )
              
              foreach ($file in $files) {
                  if (!(Test-Path $file)) {
                      throw "Values file not found: $file"
                  }
              
                  $content = Get-Content $file -Raw
              
                  # Find the image section
                  $imageMatch = [regex]::Match(
                      $content,
                      '(?ms)^image:[ \t]*\r?\n(?<body>(?:(?:[ \t]+.*)?\r?\n)*)'
                  )
              
                  if ($imageMatch.Success) {
                      $imageBody = $imageMatch.Groups["body"].Value
              
                      # Update tag/tags if present under image:
                      $tagPattern = '(?m)^([ \t]+)(tags|tag):[ \t]*.*$'
              
                      if ([regex]::IsMatch($imageBody, $tagPattern)) {
                          $imageBody = [regex]::Replace(
                              $imageBody,
                              $tagPattern,
                              { param($m) $m.Groups[1].Value + $m.Groups[2].Value + ': "' + $tag + '"' },
                              1
                          )
              
                          Write-Host "Updated image tag in $file"
                      }
                      else {
                          # Add tag under image: if missing
                          $imageBody = $imageBody.TrimEnd("`r", "`n") + "`n  tag: `"$tag`"`n"
                          Write-Host "Added image.tag in $file"
                      }
              
                      $content = $content.Substring(0, $imageMatch.Groups["body"].Index) +
                                 $imageBody +
                                 $content.Substring($imageMatch.Groups["body"].Index + $imageMatch.Groups["body"].Length)
                  }
                  else {
                      # Create image section if it does not exist
                      $content = $content.TrimEnd() + "`nimage:`n  tag: `"$tag`"`n"
                      Write-Host "Created image section in $file"
                  }
              
                  Set-Content -Path $file -Value $content -NoNewline
              }