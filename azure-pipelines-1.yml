pool: default

trigger:
  - none

parameters:

- name: containerRegistry
  displayName: Ingestion_Docker_Build&Push
  type: boolean
  default: false

- name: Kubernate_secrer
  displayName: Kubernate_secrer
  type: boolean
  default: false
 
- name: Namespace_Environment
  displayName: Namespace_Environment
  type: string
  default: dev
  values:
  - dev
  - prod


variables:
- group: Axion_Group_variable


stages:
  - stage: 
    displayName: Ingestion_Docker_Build&Push 
    condition: eq('${{ parameters.containerRegistry }}', 'true')
    jobs:
      - job: 
        displayName: Ingestion_Docker_Build&Push 
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-acr-svc-connection'
            repository: 'axion-ingestion'
            command: 'buildAndPush'
            Dockerfile: '**/axion-ingestion-service/Dockerfile'
            tags: '$(Build.BuildId)-BuildId'
        
  - stage:
    displayName: Update Tags in github-> value-dev.yaml and value-pod.yaml
    jobs:
      - job:
        displayName: Update git file
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              $ErrorActionPreference = "Stop"
              
              $tag = "$(Build.BuildId)-BuildId"
              
              $files = @(
                  "axion-ingestion-service/helm/values-dev.yaml",
                  "axion-ingestion-service/helm/values-prod.yaml"
              )
              
              foreach ($file in $files) {
                  if (!(Test-Path $file)) {
                      throw "Values file not found: $file"
                  }
              
                  $content = Get-Content $file -Raw
              
                  $imagePattern = '(?ms)^image:[ \t]*\r?\n(?<body>(?:(?:[ \t]+[^\r\n]*)?\r?\n)*)'
                  $imageMatch = [regex]::Match($content, $imagePattern)
              
                  if (!$imageMatch.Success) {
                      throw "Top-level image section not found in $file"
                  }
              
                  $body = $imageMatch.Groups["body"].Value
                  $tagsPattern = '(?m)^([ \t]+)tags:[ \t]*.*$'
              
                  if ([regex]::IsMatch($body, $tagsPattern)) {
                      $body = [regex]::Replace(
                          $body,
                          $tagsPattern,
                          { param($m) $m.Groups[1].Value + 'tags: "' + $tag + '"' },
                          1
                      )
                  }
                  else {
                      throw "tags: field not found under image: in $file"
                  }
              
                  $content = $content.Substring(0, $imageMatch.Groups["body"].Index) +
                             $body +
                             $content.Substring(
                                 $imageMatch.Groups["body"].Index +
                                 $imageMatch.Groups["body"].Length
                             )
              
                  Set-Content -Path $file -Value $content -NoNewline
              
                  Write-Host "Updated $file with tags: $tag"
                  Get-Content $file
              }
              
              git config user.email "azure-pipelines@users.noreply.github.com"
              git config user.name "Azure DevOps Pipeline"
              
              git add $files
              
              git diff --cached --quiet
              if ($LASTEXITCODE -ne 0) {
                  git commit -m "Update ingestion image tags to $tag"
              }
              else {
                  Write-Host "No file changes detected."
              }
              
              $token = $env:GITHUB_PAT
              
              if ([string]::IsNullOrWhiteSpace($token)) {
                  throw "GitHubPAT is missing. Check the variable group and env mapping."
              }
              
              $basic = [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes("x-access-token:$token")
              )
              
              $repo = "https://github.com/sudarshansutar1995/Axion_CiCD_Helm_ARGOCD.git"
              
              git -c "http.extraheader=AUTHORIZATION: basic $basic" push $repo HEAD:main
              
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to push Helm values to GitHub."
              }
              
              Write-Host "Successfully pushed Helm tags to GitHub."