pool: default

trigger:
  - none

parameters:

- name: containerRegistry
  displayName: Ingestion_Docker_Build&Push
  type: boolean
  default: false

- name: Kubernate_secrer
  displayName: Kubernate_secrer
  type: boolean
  default: false
 
- name: Namespace_Environment
  displayName: Namespace_Environment
  type: string
  default: dev
  values:
  - dev
  - prod


variables:
- group: Axion_Group_variable


stages:
  - stage: 
    displayName: Ingestion_Docker_Build&Push 
    condition: eq('${{ parameters.containerRegistry }}', 'true')
    jobs:
      - job: 
        displayName: Ingestion_Docker_Build&Push 
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-acr-svc-connection'
            repository: 'axion-ingestion'
            command: 'buildAndPush'
            Dockerfile: '**/axion-ingestion-service/Dockerfile'
            tags: '$(Build.BuildId)-BuildId'
    
  - stage: Update_Helm_Tags
    displayName: Update Dev and Prod Helm Tags in Azure Repos
    jobs:
    - job: Update_Git_Files
      displayName: Update Helm Values and Push to Azure Repos
      steps:
      - checkout: self
        persistCredentials: true
        clean: true

      - task: PowerShell@2
        displayName: Update Helm Tags and Push to Azure Repos
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = "Stop"

            $tag = "$(Build.BuildId)-BuildId"
            $repo = "https://sudarshansutar100@dev.azure.com/sudarshansutar100/axion-argocd/_git/Axion_CiCD_Helm_ARGOCD"

            $files = @(
                "axion-ingestion-service/helm/values-dev.yaml",
                "axion-ingestion-service/helm/values-prod.yaml"
            )

            foreach ($file in $files) {
                if (!(Test-Path $file)) {
                    throw "Values file not found: $file"
                }

                $content = Get-Content -Path $file -Raw
                $imagePattern = '(?ms)^image:[ \t]*\r?\n(?<body>(?:(?:[ \t]+.*)?\r?\n)*)'
                $imageMatch = [regex]::Match($content, $imagePattern)

                if (!$imageMatch.Success) {
                    throw "image: section not found in $file"
                }

                $imageBody = $imageMatch.Groups["body"].Value
                $tagPattern = '(?m)^([ \t]*)(tags|tag):[ \t]*.*$'

                if ([regex]::IsMatch($imageBody, $tagPattern)) {
                    $imageBody = [regex]::Replace(
                        $imageBody,
                        $tagPattern,
                        [System.Text.RegularExpressions.MatchEvaluator]{
                            param($m)
                            $m.Groups[1].Value + $m.Groups[2].Value + ': "' + $tag + '"'
                        },
                        1
                    )
                }
                else {
                    $imageBody = $imageBody.TrimEnd("`r", "`n") +
                        "`n  tags: `"$tag`"`n"
                }

                $start = $imageMatch.Groups["body"].Index
                $length = $imageMatch.Groups["body"].Length

                $content = $content.Substring(0, $start) +
                          $imageBody +
                          $content.Substring($start + $length)

                Set-Content -Path $file -Value $content -NoNewline
                Write-Host "Updated $file with tag $tag"
            }

            git config user.email "azure-pipelines@users.noreply.github.com"
            git config user.name "Azure DevOps Pipeline"

            git add -- $files
            if ($LASTEXITCODE -ne 0) {
                throw "Git add failed."
            }

            git diff --cached --quiet
            $diffExitCode = $LASTEXITCODE

            if ($diffExitCode -eq 0) {
                Write-Host "No Helm file changes detected."
                exit 0
            }

            if ($diffExitCode -ne 1) {
                throw "Git diff failed."
            }

            git commit -m "Update ingestion image tag to $tag"
            if ($LASTEXITCODE -ne 0) {
                throw "Git commit failed."
            }

            git push $repo HEAD:refs/heads/main
            if ($LASTEXITCODE -ne 0) {
                throw "Azure Repos push failed. Check Build Service permissions and branch policies."
            }

            Write-Host "Successfully updated Helm tags in Azure Repos."