pool: default

trigger:
  - none

parameters:

- name: containerRegistry
  displayName: Ingestion_Docker_Build&Push
  type: boolean
  default: false

- name: Kubernate_secrer
  displayName: Kubernate_secrer
  type: boolean
  default: false
 
- name: Namespace_Environment
  displayName: Namespace_Environment
  type: string
  default: dev
  values:
  - dev
  - prod


variables:
- group: Axion_Group_variable


stages:
  - stage: 
    displayName: Ingestion_Docker_Build&Push 
    condition: eq('${{ parameters.containerRegistry }}', 'true')
    jobs:
      - job: 
        displayName: Ingestion_Docker_Build&Push 
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'docker-acr-svc-connection'
            repository: 'axion-ingestion'
            command: 'buildAndPush'
            Dockerfile: '**/axion-ingestion-service/Dockerfile'
            tags: '$(Build.BuildId)-BuildId'
        
  - stage:
    displayName: Update Tags in github-> value-dev.yaml and value-pod.yaml
    jobs:
      - job:
        displayName: Update git file
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              $ErrorActionPreference = "Stop"
              
              $tag = "$(Build.BuildId)-BuildId"
              
              $files = @(
                  "axion-ingestion-service/helm/values-dev.yaml",
                  "axion-ingestion-service/helm/values-prod.yaml"
              )
              
              foreach ($file in $files) {
                  if (!(Test-Path $file)) {
                      throw "Values file not found: $file"
                  }
              
                  $content = Get-Content $file -Raw
                  $pattern = '(?m)^([ \t]*tags:[ \t]*)[^\r\n]*$'
              
                  if (-not [regex]::IsMatch($content, $pattern)) {
                      throw "Could not find tags field in $file"
                  }
              
                  $content = [regex]::Replace(
                      $content,
                      $pattern,
                      { param($m) $m.Groups[1].Value + '"' + $tag + '"' },
                      1
                  )
              
                  Set-Content -Path $file -Value $content -NoNewline
                  Write-Host "Updated $file with image tag $tag"
              }
              
              git config user.name "Azure DevOps"
              git config user.email "azure-pipelines@local"
              
              git add -- $files
              git diff --cached --quiet
              $diffExitCode = $LASTEXITCODE
              
              if ($diffExitCode -eq 0) {
                  Write-Host "No changes to commit."
                  exit 0
              }
              
              if ($diffExitCode -ne 1) {
                  throw "Failed to check Git changes."
              }
              
              git commit -m "Update ingestion image tag to $tag"
              
              if ($LASTEXITCODE -ne 0) {
                  throw "Git commit failed."
              }
              
              $token = $env:GITHUB_PAT
              
              if ([string]::IsNullOrWhiteSpace($token)) {
                  throw "GitHubPAT secret variable is missing."
              }
              
              $basic = [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes("x-access-token:$token")
              )
              
              $githubRepo = "https://github.com/sudarshansutar1995/Axion_CiCD_Helm_ARGOCD.git"
              
              git -c "http.extraheader=AUTHORIZATION: basic $basic" push $githubRepo HEAD:main
              
              if ($LASTEXITCODE -ne 0) {
                  throw "GitHub push failed."
              }
              
              Write-Host "Dev and Prod image tags updated and pushed successfully."
