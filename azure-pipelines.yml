pool: default

trigger:
  - none

variables:
- group: Axion_Group_variable

stages:

# ============================================================
# Stage 1: Database Connection
# ============================================================
- stage: Database_Connection
  displayName: Database Connection

  jobs:
  - job: Database_Connection
    displayName: Database Connection

    steps:
    - task: AzureCLI@3
      displayName: Test PostgreSQL Connection
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'axion-helm-project'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Testing PostgreSQL connection..."

          psql "host=$(postgresHost) port=$(postgresPort) dbname=$(postgresDb) user=$(postgresUser) sslmode=require connect_timeout=10" `
            -c "SELECT current_database();"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Database connection failed."
              exit $LASTEXITCODE
          }

          Write-Host "Database connection successful."

      env:
        PGPASSWORD: $(postgresPassword)


# ============================================================
# Stage 2: Apply Database Schema
# ============================================================
- stage: Apply_Database_Schema
  displayName: Apply Database Schema

  jobs:
  - job: Apply_Database_Schema
    displayName: Apply Database Schema

    steps:
    - task: AzureCLI@3
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'axion-helm-project'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Checking telemetry table..."
          
                $result = psql "host=$(postgresHost) port=$(postgresPort) dbname=$(postgresDb) user=$(postgresUser) sslmode=require connect_timeout=10" `
                  -t -A `
                  -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='public' AND table_name='telemetry');"
          
                $result = $result.Trim()
          
                Write-Host "Telemetry table exists: $result"
          
                if ($result -eq "t") {
                    Write-Host "Telemetry table already exists."
                    Write-Host "##vso[task.setvariable variable=TelemetryTableExists;isOutput=true]true"
                }
                else {
                    Write-Host "Telemetry table does not exist."
                    Write-Host "##vso[task.setvariable variable=TelemetryTableExists;isOutput=true]false"
                }

      env:
        PGPASSWORD: $(postgresPassword)


# ============================================================
# Stage 3: Show Table Details
# ============================================================
- stage: Show_Table_Detail
  displayName: Show Table Details

  jobs:
  - job: Show_Table_Detail
    displayName: Show Table Details

    steps:
    - task: AzureCLI@3
      displayName: Show Database Table Details
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'axion-helm-project'
        scriptType: 'ps'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "Showing database table details..."

          psql "host=$(postgresHost) port=$(postgresPort) dbname=$(postgresDb) user=$(postgresUser) sslmode=require connect_timeout=10" `
            -c "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema='public' ORDER BY table_name, ordinal_position;"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to retrieve database table details."
              exit $LASTEXITCODE
          }

          Write-Host "Database table details retrieved successfully."

      env:
        PGPASSWORD: $(postgresPassword)