
pool: default

trigger:
  - none

parameters:

- name: Docker_Build_and_Push_ACR
  displayName: Docker Build and Push to ACR
  type: boolean
  default: false

- name: Deploy_to_KubernetesCluster
  displayName: Deploy to Kubernetes Cluster
  type: boolean
  default: false

- name: Namespace_Environment
  displayName: Namespace Environment
  type: string
  default: dev
  values:
  - dev
  - prod

variables:
- group: Axion_Group_variable

stages:

# ============================================================
# Stage 1 - Docker Build and Push
# ============================================================

- stage: Docker_Build_and_Push_ACR
  displayName: Docker Build and Push ACR for Data Simulator
  condition: eq('${{ parameters.Docker_Build_and_Push_ACR }}', 'true')

  jobs:

  - job: DataSimulator_Docker_Build_Push
    displayName: Data Simulator Docker Build and Push

    steps:

    - task: Docker@2
      displayName: Build and Push Data Simulator Image
      inputs:
        containerRegistry: 'docker-acr-svc-connection'
        repository: 'axion-data-simulator'
        command: 'buildAndPush'
        Dockerfile: '**/axion-data-simulator/Dockerfile'
        tags: |
          $(Build.BuildId)-BuildId



- stage: Update_Helm_Tags
  displayName: Update Dev and Prod Data Simulator Helm Tags
  jobs:
  - job: Update_Git_Files
    displayName: Update Helm Values and Push to Azure Repos
    steps:
    - checkout: self
      persistCredentials: true
      clean: true

    - task: PowerShell@2
      displayName: Update Helm Tags and Push to Azure Repos
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          $tag = "$(Build.BuildId)-BuildId"

          $files = @(
            "axion-data-simulator/helm/values-dev.yaml",
            "axion-data-simulator/helm/values-prod.yaml"
          )

          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "File not found: $file"
            }

            $content = Get-Content $file -Raw

            $pattern = '(?ms)(^image:\s*\r?\n(?:(?:[ \t]+.*)?\r?\n)*?[ \t]+(?:tag|tags):\s*)[^\r\n]*'

            if ([regex]::IsMatch($content, $pattern)) {
              $content = [regex]::Replace(
                $content,
                $pattern,
                [System.Text.RegularExpressions.MatchEvaluator]{
                  param($m)
                  $m.Groups[1].Value + '"' + $tag + '"'
                },
                1
              )
            }
            else {
              throw "Could not find tag/tags under image in $file. Check the YAML structure."
            }

            Set-Content -Path $file -Value $content -NoNewline
            Write-Host "Updated $file to tag $tag"
          }

          git config user.email "azure-pipelines@users.noreply.github.com"
          git config user.name "Azure DevOps Pipeline"

          git add -- $files
          if ($LASTEXITCODE -ne 0) {
            throw "Git add failed"
          }

          git diff --cached --quiet
          $diffExitCode = $LASTEXITCODE

          if ($diffExitCode -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }

          if ($diffExitCode -ne 1) {
            throw "Git diff failed"
          }

          git commit -m "Update Data Simulator image tag to $tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Git commit failed"
          }

          git -c http.extraheader="AUTHORIZATION: bearer $env:SYSTEM_ACCESSTOKEN" `
            push origin HEAD:refs/heads/main

          if ($LASTEXITCODE -ne 0) {
            throw "Push failed. Verify repository access, Contribute permission, and main branch policies."
          }

          Write-Host "Data Simulator Helm tags successfully pushed to Azure Repos."
